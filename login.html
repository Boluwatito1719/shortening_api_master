
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>


<body
    class="flex flex-col items-center justify-center h-screen bg-gray-300 bg-[url('images/bg-boost-desktop.svg')] bg-cover bg-center">

    <form id="login-form"
        class="max-w-lg p-8 w-full bg-[hsl(257,57%,26%)] bg-[url('images/bg-boost-desktop.svg')] bg-cover bg-center bg-blend-multiply text-white gap-8 rounded-lg shadow-md mb-5">

        <div class="flex flex-col gap-6">

            <!-- Heading -->
            <div>

                <h1 class="text-4xl font-bold">
                    Welcome Back
                </h1>

                <div class="flex gap-1 text-base text-gray-300">

                    <p>Don't have an account?</p>

                    <a href="sign.html"
                        class="text-[hsl(257,57%,66%)] hover:underline">
                        Sign Up
                    </a>

                </div>

            </div>


            <!-- Email -->
            <div>

                <label for="email"
                    class="block font-semibold text-lg">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="w-full px-4 py-3 text-lg border rounded-md text-black">

            </div>


            <!-- Password -->
            <div>

                <label for="password"
                    class="block font-semibold text-lg">
                    Password:
                </label>


                <!-- Password input + Eye -->
                <div class="relative">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 pr-12 text-lg border rounded-md text-black">
                         <div class="flex gap-1 text-base text-gray-300">

                    <p></p>

                    <a href=""
                        class="text-[hsl(257,57%,66%)] hover:underline">
                        forgot password
                    </a>

                </div>


                    <!-- Eye button -->
                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-900">

                        <span
                            class="material-symbols-outlined"
                            id="eyeIcon">
                            visibility
                        </span>

                    </button>

                </div>


                <!-- Error / connection message -->
                <p id="message"
                    class="text-red-700">
                </p>

            </div>


            <!-- Login button -->
            <button
                type="submit"
                id="mySubmit"
                class="w-full py-3 text-lg text-white bg-[hsl(257,57%,46%)] rounded-md hover:bg-[hsl(257,57%,76%)] active:bg-[hsl(257,57%,66%)]">

                Log In

            </button>

        </div>

    </form>


    <script src="login.js"></script>

</body>

</html>
