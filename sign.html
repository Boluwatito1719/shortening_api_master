<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://jsdelivr.net">
<script src="https://jsdelivr.net"></script>

</head>
<body>
   <div class="flex min-h-screen items-center justify-center  bg-[hsl(257,57%,26%)] bg-[url('images/bg-boost-desktop.svg')] bg-cover bg-center bg-blend-multiply bg-gray-400 px-4 py-12 sm:px-6 lg:px-8  ">
  <div class="w-full max-w-md space-y-8 rounded-xl  p-8 shadow-md  w-full bg-[hsl(257,57%,26%)] bg-[url('images/bg-boost-desktop.svg')] bg-cover bg-center bg-blend-multiply text-white gap-6 rounded-lg shadow-md ">
    <div>
      <h2 class="text-center text-3xl font-bold tracking-tight text-white">Create your account</h2>
    </div>
    
   <form id="signup-form" class="space-y-6">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="first-name" class="block text-sm font-medium text-gray-200">First name</label>
          <input type="text" id="first-name" name="first_name" required 
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
        </div>
        
        <div>
          <label for="last-name" class="block text-sm font-medium text-gray-200">Last name</label>
          <input type="text" id="last-name" name="last_name" required 
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
        </div>
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-200">Phone</label>
        <input type="tel" id="phone" name="phone" required 
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-200">Email address</label>
        <input type="email" id="email" name="email" required 
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-200">Password</label>
        <input type="password" id="password" name="password" required 
               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">


               <ul id="checklist" class="hidden text-sm text-gray-300 mt-2">
    <li id="req-length" class="invalid"> At least 8 characters</li>
    <li id="req-upper" class="invalid"> At least 1 uppercase letter (A-Z)</li>
    <li id="req-lower" class="invalid"> At least 1 lowercase letter (a-z)</li>
    <li id="req-number" class="invalid"> At least 1 number (0-9)</li>
    <li id="req-special" class="invalid"> At least 1 special character (@, $, !, etc.)</li>
  </ul>
      </div>

      <div>
        <label for="confirm-password" class="block text-sm font-medium text-gray-200">Confirm password</label>
<input type="password" id="confirm-password" name="password_confirmation" required               class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md border border-transparent bg-[hsl(257,57%,26%)] px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-[hsl(257,57%,56%)] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed" id="submit-btn" disabled>
  Sign up
</button>

        <h1 class="">Already have an account? <span> <a href="login.html" class="text-[hsl(257,57%,66%)] hover:underline  mx-auto">login</a></span></h1>
      </div>


    </form>
  </div>
 

</div>

<script src="sign.js"></script>
</body>
</html>
